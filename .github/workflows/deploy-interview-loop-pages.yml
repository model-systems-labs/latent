name: Deploy Learning Examples

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-interview-loop-pages.yml"
      - ".github/workflows/release-course-kit.yml"
      - "app/**"
      - "build/**"
      - "examples/learning-platform/interview-loop/**"
      - "examples/learning-platform/llm-learning/**"
      - "examples/learning-platform/ten-problems/**"
      - "next.config.ts"
      - "package-lock.json"
      - "package.json"
      - "packages/**"
      - "postcss.config.mjs"
      - "products/**"
      - "public/**"
      - "scripts/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the Course Kit CLI
        run: npm run build --workspace @latent/course-kit
      - name: Verify committed public artifacts
        run: |
          npm run open-learning:generate
          git diff --exit-code -- docs public
      - name: Build the complete learner suite
        run: npm run learning-examples:build
      - name: Refuse to replace published version 1 schema bytes
        run: |
          for schema_path in \
            open-learning/v1/learning-pack.schema.json \
            open-learning/v1/learning-feed.schema.json \
            question-groups/v1/question-group-library.schema.json \
            question-groups/v1/question-group-progress.schema.json
          do
            url="https://model-systems-labs.github.io/latent/$schema_path"
            existing="$RUNNER_TEMP/$(basename "$schema_path")"
            http_status="$(curl --silent --show-error --location --output "$existing" --write-out '%{http_code}' "$url")"
            if [ "$http_status" = "200" ]; then
              cmp "$existing" ".pages-site/$schema_path"
            else
              printf 'Published schema %s returned HTTP %s\n' "$url" "$http_status" >&2
              exit 1
            fi
          done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-site
      - name: Deploy the learner experiences without replacing public schemas
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
