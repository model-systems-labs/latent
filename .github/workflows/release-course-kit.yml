name: Release Course Kit

# Every Course Kit tag publishes a registry-independent GitHub tarball and
# immutable schemas. npm publishing is intentionally deferred until a later
# release can represent the registry transition without making an immutable
# tag stale.

on:
  push:
    tags:
      - "course-kit-v*"

concurrency:
  group: course-kit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require a matching version tag on main
        run: |
          git fetch --force origin main:refs/remotes/origin/main
          node scripts/verify-release-ref.mjs "$GITHUB_REF_NAME"
          npm run release:check --workspace @latent/course-kit -- "$GITHUB_REF_NAME"
      - name: Validate the exact tagged repository
        run: |
          npm run validate
          git diff --exit-code
      - name: Refuse an existing npm version
        run: |
          set +e
          npm view @latent/course-kit versions --json > "$RUNNER_TEMP/course-kit-versions.json" 2> "$RUNNER_TEMP/npm-view-error.txt"
          npm_view_status=$?
          set -e
          if [ "$npm_view_status" -ne 0 ]; then
            if grep -q "E404" "$RUNNER_TEMP/npm-view-error.txt"; then
              printf '[]\n' > "$RUNNER_TEMP/course-kit-versions.json"
            else
              cat "$RUNNER_TEMP/npm-view-error.txt" >&2
              exit "$npm_view_status"
            fi
          fi
          node --input-type=module --eval '
            import { readFile } from "node:fs/promises";
            const manifest = JSON.parse(await readFile("packages/course-kit/package.json", "utf8"));
            const value = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/course-kit-versions.json", "utf8"));
            const versions = Array.isArray(value) ? value : [value];
            if (versions.includes(manifest.version)) {
              throw new Error(`@latent/course-kit@${manifest.version} is already published`);
            }
          '
      - name: Pack and smoke-test the exact tarball
        run: |
          mkdir -p "$RUNNER_TEMP/course-kit-release"
          npm pack --workspace @latent/course-kit --pack-destination "$RUNNER_TEMP/course-kit-release"
          tarball="$(find "$RUNNER_TEMP/course-kit-release" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          node packages/course-kit/scripts/smoke-package.mjs "$tarball"
          git diff --exit-code -- packages/course-kit/docs packages/course-kit/schema
          mkdir -p course-kit-release
          cp "$tarball" course-kit-release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: course-kit-npm-tarball
          path: course-kit-release/*.tgz
          if-no-files-found: error

  schemas:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate the schema portion of the Pages artifact
        run: |
          npm run build --workspace @latent/course-kit
          mkdir -p \
            _schema-site/open-learning/v1 \
            _schema-site/open-learning \
            _schema-site/question-groups/v1 \
            _schema-site/question-groups
          node packages/course-kit/bin/latent-learning.mjs schema _schema-site/open-learning/v1/learning-pack.schema.json
          node packages/course-kit/bin/latent-learning.mjs schema _schema-site/open-learning/v1/learning-feed.schema.json --feed
          node packages/course-kit/bin/latent-learning.mjs questions schema _schema-site/question-groups/v1/question-group-library.schema.json
          node packages/course-kit/bin/latent-learning.mjs questions schema _schema-site/question-groups/v1/question-group-progress.schema.json --progress
          cp _schema-site/open-learning/v1/learning-pack.schema.json _schema-site/open-learning/learning-pack.schema.json
          cp _schema-site/open-learning/v1/learning-feed.schema.json _schema-site/open-learning/learning-feed.schema.json
          cp public/question-groups/guide.md _schema-site/question-groups/guide.md
          cmp public/open-learning/v1/learning-pack.schema.json _schema-site/open-learning/v1/learning-pack.schema.json
          cmp public/open-learning/v1/learning-feed.schema.json _schema-site/open-learning/v1/learning-feed.schema.json
          cmp public/open-learning/learning-pack.schema.json _schema-site/open-learning/learning-pack.schema.json
          cmp public/open-learning/learning-feed.schema.json _schema-site/open-learning/learning-feed.schema.json
          cmp public/question-groups/v1/question-group-library.schema.json _schema-site/question-groups/v1/question-group-library.schema.json
          cmp packages/course-kit/schema/question-group-library.schema.json _schema-site/question-groups/v1/question-group-library.schema.json
          cmp public/question-groups/v1/question-group-progress.schema.json _schema-site/question-groups/v1/question-group-progress.schema.json
          cmp packages/course-kit/schema/question-group-progress.schema.json _schema-site/question-groups/v1/question-group-progress.schema.json
          cp -R public/open-learning/. _schema-site/open-learning/
          cp -R public/question-groups/. _schema-site/question-groups/
          touch _schema-site/.nojekyll
      - name: Add the validated course to the Pages root
        run: |
          npm run build --prefix examples/learning-platform/interview-loop
          cp -R examples/learning-platform/interview-loop/dist/. _schema-site/
      - name: Refuse to replace published version 1 schema bytes
        run: |
          for schema in learning-pack.schema.json learning-feed.schema.json; do
            url="https://model-systems-labs.github.io/latent/open-learning/v1/$schema"
            existing="$RUNNER_TEMP/$schema"
            http_status="$(curl --silent --show-error --location --output "$existing" --write-out '%{http_code}' "$url")"
            if [ "$http_status" = "200" ]; then
              cmp "$existing" "_schema-site/open-learning/v1/$schema"
            else
              printf 'Published schema %s returned HTTP %s\n' "$url" "$http_status" >&2
              exit 1
            fi
          done
          for question_schema in question-group-library.schema.json question-group-progress.schema.json; do
            question_url="https://model-systems-labs.github.io/latent/question-groups/v1/$question_schema"
            question_existing="$RUNNER_TEMP/$question_schema"
            question_status="$(curl --silent --show-error --location --output "$question_existing" --write-out '%{http_code}' "$question_url")"
            if [ "$question_status" = "200" ]; then
              cmp "$question_existing" "_schema-site/question-groups/v1/$question_schema"
            elif [ "$question_status" = "404" ] && [ "$GITHUB_REF_NAME" = "course-kit-v0.2.0" ]; then
              printf 'Publishing new immutable schema %s\n' "$question_url"
            else
              printf 'Unexpected HTTP %s while checking %s\n' "$question_status" "$question_url" >&2
              exit 1
            fi
          done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _schema-site
      - name: Deploy immutable schemas to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  github-release:
    needs:
      - verify
      - schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: course-kit-npm-tarball
          path: course-kit-release
      - name: Add a checksum and publish the registry-independent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="$(find course-kit-release -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          release_notes="docs/release/${GITHUB_REF_NAME}.md"
          demo="docs/release/latent-v0.2-demo.webm"
          test -f "$release_notes"
          test -f "$demo"
          (cd course-kit-release && sha256sum "$(basename "$tarball")" > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            "$tarball" \
            course-kit-release/SHA256SUMS \
            "$demo" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Course Kit ${GITHUB_REF_NAME#course-kit-v}" \
            --notes-file "$release_notes" \
            --verify-tag
